name: Supabase Keep Alive

on:
   schedule:
      # Gira ogni giorno alle 00:00 UTC (molto più sicuro per evitare i 7 giorni di timeout)
      - cron: "0 0 * * *"
   workflow_dispatch:

jobs:
   ping:
      runs-on: ubuntu-latest
      steps:
         - name: Ping Supabase API Direct
           run: |
              curl -f -X GET "https://tjssmfntbuxubytujcdj.supabase.co/rest/v1/" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
